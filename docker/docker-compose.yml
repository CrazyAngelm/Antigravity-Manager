services:
  antigravity-manager:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: antigravity-manager:patched
    container_name: antigravity-manager
    ports:
      - "8045:8045"
    volumes:
      - ~/.antigravity_tools:/root/.antigravity_tools
    environment:
      - LOG_LEVEL=info
      - API_KEY=test  # [重要] 請設置您的安全密鑰，若不設置則在日誌中查看隨機密鑰
      - ABV_BIND_LOCAL_ONLY=false  # 允许容器外部访问
    restart: unless-stopped
